# Site settings. Homepage content lives in index.md.
# This file is not reloaded by `jekyll serve`; restart the server after editing it.
url: https://yuxinlai.com
baseurl: ""
repository: kkkstra/kkkstra.github.io
timezone: Asia/Shanghai
exclude: [README.md, LICENSE, docs, Gemfile, Gemfile.lock, run_server.sh, vendor, google_scholar_crawler, github_myprofile_updater]

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo

defaults:
  - scope: {path: ""}
    values: {layout: default}

plugins: [jekyll-sitemap, jekyll-redirect-from]
